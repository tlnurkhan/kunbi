<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Қытайға түсу, KUNBI</title>
<meta name="description" content="KUNBI Education Center: Қытайға оқуға түсуге толық сүйемелдеу. Алматы.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#111111;--ink-2:#1c1b19;--gold:#b8892d;--gold-light:#d9b566;--paper:#faf8f3;--white:#ffffff;--muted:#5d5a54;--muted-dark:rgba(250,248,243,.7);--line:#e4dfd3}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:17px;line-height:1.6}
a{color:inherit}
.container{max-width:1200px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:10;background:var(--white);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;height:72px}
.nav img{height:54px;display:block}
.nav nav{display:flex;gap:22px;font-weight:500;font-size:15px;white-space:nowrap}
.nav nav a{text-decoration:none}
.nav nav a:hover{color:var(--gold)}
.lang{display:flex;gap:4px}
.lang button{border:1px solid var(--line);background:none;font:600 13px Inter,sans-serif;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--ink)}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--white);border-color:var(--ink)}
.hero{position:relative;overflow:hidden;background:var(--ink);color:var(--paper);min-height:calc(100vh - 72px);display:flex;align-items:center;padding:80px 0}
.hero-shapes-back,.hero-shapes-mid{position:absolute;inset:0;pointer-events:none}
.shape{position:absolute;border-radius:50%}
.shape-a{width:520px;height:520px;right:-120px;top:-120px;background:radial-gradient(circle,rgba(217,181,102,.26),transparent 70%);animation:floatA 12s ease-in-out infinite}
.shape-b{width:420px;height:420px;left:-140px;bottom:-140px;background:radial-gradient(circle,rgba(217,181,102,.14),transparent 70%);animation:floatB 15s ease-in-out infinite}
.shape-c{width:180px;height:180px;right:12%;bottom:16%;border:1px solid rgba(217,181,102,.4);animation:floatC 10s ease-in-out infinite}
@keyframes floatA{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-30px)}}
@keyframes floatB{0%,100%{transform:translate(0,0)}50%{transform:translate(-16px,22px)}}
@keyframes floatC{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,14px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
.hero .container{position:relative;width:100%}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-light)}
.hero h1{font-size:72px;font-weight:800;line-height:1.08;margin:18px 0 22px;max-width:900px;letter-spacing:-.02em}
.subtitle{font-size:19px;color:var(--muted-dark);max-width:620px;margin-bottom:34px}
.btn-primary{display:inline-block;background:var(--gold-light);color:var(--ink);font:600 18px Inter,sans-serif;text-decoration:none;border:0;padding:16px 30px;border-radius:8px;cursor:pointer;transition:.25s ease}
.btn-primary:hover{transform:translateY(-3px);filter:brightness(1.08)}
.scroll-down{margin-top:52px;width:26px;height:26px;color:var(--gold-light)}
.scroll-down svg{animation:bounce 2s ease-in-out infinite}
section.block{padding:110px 0}
h2{font-size:52px;font-weight:800;line-height:1.14;letter-spacing:-.015em;margin:12px 0 18px}
.lead{color:var(--muted);max-width:680px;margin-bottom:44px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;perspective:900px}
.feature-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:30px;transition:transform .3s ease,border-color .3s ease}
.feature-card:hover{transform:translateY(-6px);border-color:var(--gold)}
.feature-card svg{width:28px;height:28px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-bottom:14px}
.feature-card h3{font-size:22px;font-weight:700;margin-bottom:8px;line-height:1.3}
.feature-card p{font-size:16px;color:var(--muted)}
.prices{background:var(--white)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.tabs button{border:1px solid var(--line);background:var(--paper);padding:11px 16px;border-radius:8px;font:600 15px Inter,sans-serif;cursor:pointer;color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--white);border-color:var(--ink)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{text-align:left;padding:15px 12px;border-bottom:1px solid var(--line);font-size:16px}
th{font-size:14px;color:var(--muted);font-weight:600}
td:first-child{font-weight:600}
.note{margin-top:14px;font-size:15px;color:var(--muted)}
.china{background:var(--ink);color:var(--paper)}
.china .lead{color:var(--muted-dark)}
.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:22px;counter-reset:s}
.steps li{counter-increment:s;border-top:2px solid var(--gold-light);padding-top:16px}
.steps li::before{content:counter(s);display:block;font-weight:800;font-size:30px;color:var(--gold-light)}
.steps p{color:var(--muted-dark);font-size:16px}
.steps strong{display:block;margin:6px 0}
.disclaimer{margin-top:32px;font-size:15px;color:var(--muted-dark)}
.closing-cta{background:var(--ink-2);color:var(--paper);padding:120px 24px;text-align:center;position:relative}
.glow{position:absolute;left:50%;top:60%;width:640px;height:640px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(217,181,102,.14) 0%,transparent 70%);pointer-events:none}
.closing-cta p{color:var(--muted-dark);max-width:560px;margin:0 auto 30px}
form{position:relative;max-width:480px;margin:0 auto;display:grid;gap:12px;text-align:left}
label{font-size:14px;font-weight:500}
input,select{width:100%;padding:13px 14px;border-radius:8px;border:1px solid rgba(250,248,243,.3);background:#0003;color:var(--paper);font:16px Inter,sans-serif}
select option{color:#111}
form .btn-primary{width:100%}
.form-msg{min-height:22px;font-size:15px;color:var(--gold-light);text-align:center}
footer{background:var(--ink);color:var(--muted-dark);padding:44px 0;font-size:15px}
.foot{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between}
footer a{color:var(--gold-light)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.features .grid{grid-template-columns:repeat(2,1fr)}
@media (max-width:1040px){.nav nav{display:none}}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:repeat(2,1fr)}.nav nav{display:none}.hero h1{font-size:60px}h2{font-size:42px}}
@media (max-width:580px){.grid,.features .grid,.steps{grid-template-columns:1fr}.hero h1{font-size:44px}h2{font-size:34px}section.block{padding:72px 0}.closing-cta{padding:80px 24px}.nav img{height:46px}.hero{padding:56px 0}}
@media (prefers-reduced-motion:reduce){.shape,.scroll-down svg{animation:none}html{scroll-behavior:auto}}

.page-hero{position:relative;overflow:hidden;background:var(--ink);color:var(--paper);padding:110px 0}
.page-hero h1{font-size:60px;font-weight:800;line-height:1.1;letter-spacing:-.02em;margin:18px 0 22px;max-width:900px}
.page-hero .container{position:relative}
.checks{list-style:none;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:14px 32px}
.checks li{padding-left:30px;position:relative}
.checks li::before{content:"";position:absolute;left:2px;top:6px;width:14px;height:7px;border-left:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(-45deg)}
.faq{max-width:820px}
.faq details{border-bottom:1px solid var(--line);padding:18px 0}
.faq summary{font-weight:600;cursor:pointer}
.faq p{color:var(--muted);margin-top:10px}
.white{background:var(--white)}
.closing-cta h2{position:relative}
.closing-cta>p{position:relative}
@media (max-width:900px){.page-hero h1{font-size:46px}}
@media (max-width:580px){.page-hero{padding:72px 0}.page-hero h1{font-size:36px}.checks{grid-template-columns:1fr}}

.menu-btn{display:none;margin-left:auto;border:1px solid var(--ink);background:var(--ink);color:var(--white);font:600 14px Inter,sans-serif;padding:8px 12px;border-radius:6px;cursor:pointer}
@media (max-width:1040px){.menu-btn{display:block}.nav nav.open{display:flex;flex-direction:column;gap:0;position:absolute;top:72px;left:0;right:0;background:var(--white);border-bottom:1px solid var(--line);padding:6px 24px 14px;font-size:17px}.nav nav.open a{padding:14px 0;border-bottom:1px solid var(--line)}.nav nav.open a:last-child{border-bottom:0}}
</style>
</head>

let lang="kk";
function save(l){try{localStorage.setItem("kunbi-lang",l)}catch(e){}}
function load(){try{return localStorage.getItem("kunbi-lang")}catch(e){return null}}
function setLang(l){
  lang=l;save(l);document.documentElement.lang=l;document.title=TITLES[l];
  document.querySelectorAll("[data-i18n]").forEach(e=>{e.textContent=T[l][e.dataset.i18n]});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l));
  Object.keys(SELECTS).forEach(id=>{
    const s=document.getElementById(id),v=s.selectedIndex;s.innerHTML="";
    SELECTS[id].forEach(k=>{const o=document.createElement("option");o.textContent=T[l][k];s.appendChild(o)});
    s.selectedIndex=Math.max(v,0);
  });
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
document.getElementById("leadForm").addEventListener("submit",e=>{

  const t=T[lang],lines=[t.wa];

});
